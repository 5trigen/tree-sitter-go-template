name: Build/test
on:
    push:
        branches:
            - 'master'
    pull_request:
jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [macos-latest, ubuntu-latest]
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-python@v4
              with:
                  python-version: '3.11'
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.23'
            - uses: actions/setup-node@v3
              with:
                  node-version: '18'
            - run: npm install
            - name: generate grammar
              run: npm run build
            - name: check for uncommited changes
              run: git diff --exit-code
            - run: npm test

    test_go_binding:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [macos-latest, ubuntu-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22.x'
            - run: go test -v ./bindings/go

    test_python_binding:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [macos-latest, ubuntu-latest]
        steps:
        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            cache: pip
            python-version: 3.11
            cache-dependency-path: pyproject.toml
        - name: Build module
          shell: sh
          run: pip install -e .[core]
        - name: Run tests
          shell: sh
          run: python -m unittest discover -v -s bindings/python/tests

    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - run: npx prettier --check *.js
