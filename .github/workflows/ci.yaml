name: Build/test
on:
    push:
        branches:
            - 'master'
    pull_request:
jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [macos-latest, ubuntu-latest]
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
            - name: Set up tree-sitter
              uses: tree-sitter/setup-action/cli@v2
            - name: Run tests
              uses: tree-sitter/parser-test-action@v2
              with:
                generate: true
                test-parser: true
                test-go: true

    test_go_binding:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [macos-latest, ubuntu-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22.x'
            - run: go test -v ./bindings/go

    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - run: npx prettier --check *.js
